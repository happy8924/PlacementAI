<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlacementAI — AI-Powered Career & Placement Platform</title>
  <meta name="description" content="Turn your resume, skills, and career goals into a personalized path to placement. One intelligent platform for the entire placement preparation journey." />
  <link rel="icon" type="image/png" href="/logo-icon.png" />

  <!-- Immediate Theme Initializer to Prevent FOUC -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('placementai-theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Google Fonts: Inter, Plus Jakarta Sans, Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-primary text-primary font-sans antialiased selection:bg-blue-600 selection:text-white transition-colors duration-300">

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
